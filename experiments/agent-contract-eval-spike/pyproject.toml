[project]
name = "agent-contract-eval-spike"
version = "0.1.0"
description = "agent 行为契约评测 spike — 验证「契约 + 强模型扩 variation + deterministic assertion」这套方法是否可行"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agent",
    "llm-providers",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_contract_eval_spike"]
