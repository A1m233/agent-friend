[project]
name = "agent"
version = "0.1.0"
description = "agent-friend · Agent 引擎（对话编排、prompt 管理、tool calling）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bilibili-api-python==17.4.1",
    "memory",
    "llm-providers",
    "mcp==2.0.0",
    "PyYAML>=6.0",
    "tavily-python>=0.7.24",
    "httpx>=0.27.0",
    "jsonschema>=4.23.0",
    "lxml>=6.1.1",
    "portalocker>=3.2.0",
    "platformdirs>=4.0.0",
    "python-dateutil>=2.9.0",
    "tzdata>=2025.2",
    "pypdf>=5.0.0",
    "trafilatura==2.1.0",
    "watchfiles>=1.0.0",
]

[tool.uv.sources]
memory = { workspace = true }
llm-providers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
