[project]
name = "llm-providers"
version = "0.1.0"
description = "agent-friend · 统一 LLM Provider 适配层"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27.0",
    "litellm>=1.50.0",
    "openai>=2.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_providers"]
