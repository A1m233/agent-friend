[project]
name = "runtime-config"
version = "0.1.0"
description = "agent-friend · 运行时配置与凭据来源装配"
requires-python = ">=3.12,<3.13"
dependencies = [
    "keyring>=25.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
agent-friend-credentials = "runtime_config.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runtime_config"]
