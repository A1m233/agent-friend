        - role: user
          text: 你还记得我最近在准备什么考试吗
        - role: assistant
          text: 我这会儿有点想不起来,别让我乱猜。
        - role: user
          text: GMAT,我跟你说过好几次了。
        - role: assistant
          text: 对,GMAT,你最近在刷题和调整复习节奏。
    judge:
      must_mention_any:
        - GMAT
        - 乱猜
        - 不准确
        - 不稳
      forbid_memory_mechanism_terms: true
      forbid_unsupported_lookup_claim: true
      forbid_memory_mismatch_story: true

  - id: C5-05
    query: 你别跟我解释原理,就说现在你到底能确认什么
    facet: 用户明确拒绝机制解释
    source: my_synth
    fixture_session:
      days_ago: 4
      messages:
        - role: user
          text: 我有没有跟你说过我最近在学日语
        - role: assistant
          text: 我有点记不太清,先别让我瞎接。
        - role: user
          text: 有,我说过想把五十音图背熟。
        - role: assistant
          text: 对,你在学日语,先想把五十音图背熟。
