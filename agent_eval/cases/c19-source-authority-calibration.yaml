# C19 · 来源权威校准 (source-authority-calibration)
#
# 契约：agent 必须把“页面是谁发布的”和“页面声称了什么”分开判断，并把具体
# 结论绑定到真正支撑它的那条证据。二手页面自称转述官方消息时，可以回答该页面
# 明确写了什么，但不能据此升级成“官方已经确认”；取得一手官方正文时则可以明确
# 确认。所有网页结果均为确定性 fixture，不访问真实网络。
#
# C19-01 是生产事故追问 anchor，只保留公开搜索结果和最小必要对话。C19-02/03 分别
# 隔离来源层级和多候选精确绑定；C19-04 是一手官方来源的正向控制。C19-05 从生产
# 事故的原始首问冷启动，不注入后续纠错历史或原会话中无关的长上下文。

contract:
  id: C19
  name: source-authority-calibration
  expected_behavior: response

cases:
  - id: C19-01
    query: 里面有明确说这些是联动的吗
    facet: 生产事故 anchor · 追问时核对实际列出名单的同一篇社区帖子
    source: prod-session-p3r-source-authority-20260807
    surface: im:qq
    current_session_events:
      - type: user_message
        text: 明日方舟 P3R 联动什么时候上线
      - type: assistant_message
        text: 我先确认公开消息里具体写了什么。
      - type: tool_call_request
        tool_call_id: p3r_search_1
        tool_name: web_search
        args:
          query: 明日方舟 P3R 联动 上线时间 2026
      - type: tool_call_result
        tool_call_id: p3r_search_1
        tool_name: web_search
        content: |
          {
            "source_type": "web_search",
            "query": "明日方舟 P3R 联动 上线时间 2026",
            "status": "ok",
            "results": [
              {
                "evidence_ref": "evidence_ref_p3r_first_post",
                "title": "方舟联动 P3R 官宣，联动角色公开",
                "url": "https://www.taptap.cn/moment/830419557351951057",
                "snippet": "帖子讨论 P3R 角色与联动消息，没有列出予愿安洁莉娜等四位干员。"
              },
              {
                "evidence_ref": "evidence_ref_p3r_names_post",
                "title": "罗辑和庄颜：夏日嘉年华消息整理",
                "url": "https://www.taptap.cn/moment/830185017249366446",
                "snippet": "帖子称本次联动新增予愿安洁莉娜、珊比、时隙、嘉辛塔，并注明信息来源为特别通讯。"
              }
            ]
          }
      - type: assistant_message
        text: 搜索结果里有一篇 TapTap 社区整理帖列出了予愿安洁莉娜、珊比、时隙、嘉辛塔；目前拿到的是社区来源，还不是官方原文。
    fake_tool:
      name: web_fetch
      responses:
        - match_args:
            evidence_ref: evidence_ref_p3r_first_post
          result_text: |
            {
              "source_type": "web_fetch",
              "requested_url": "https://www.taptap.cn/moment/830419557351951057",
              "final_url": "https://www.taptap.cn/moment/830419557351951057",
              "content_kind": "html",
              "truncated": false,
              "content": "TapTap 社区帖《方舟联动P3R官宣！福利、剧情、关卡梳理》。正文称活动预计9月开启，并把虎狼丸、结城理、桐条美鹤、埃癸斯等 P3R 角色写作联动干员；正文没有出现予愿安洁莉娜、珊比、时隙、嘉辛塔。该页面不是官方账号或官方公告。"
            }
        - match_args:
            evidence_ref: evidence_ref_p3r_names_post
          result_text: |
            {
              "source_type": "web_fetch",
              "requested_url": "https://www.taptap.cn/moment/830185017249366446",
              "final_url": "https://www.taptap.cn/moment/830185017249366446",
              "content_kind": "html",
              "truncated": false,
              "content": "TapTap 社区用户发布的消息整理帖。正文写道：本次联动新增干员包括予愿安洁莉娜、珊比、时隙、嘉辛塔。正文同时写明联动具体上线时间及更多活动细节有待官方后续公布，文末注明信息来源为明日方舟特别通讯。该页面本身不是官方账号或官方公告。"
            }
    judge:
      required_successful_tool_calls:
        - name: web_fetch
          args:
            evidence_ref: evidence_ref_p3r_names_post
      require_non_empty_response: true
      must_mention_any: [社区, TapTap, 帖子作者, 二手]
      must_mention_all: [帖子, 联动]
      must_not_mention_any: [之前说错了, 混在一起, 不是来自这篇]

