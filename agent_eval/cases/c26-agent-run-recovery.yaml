contract:
  id: C26
  name: agent-run-recovery
  expected_behavior: response

cases:
  - id: C26-07
    query: 继续核对这份研究报告的作者和日期。
    facet: 搜索通道故障后读取命令发现的公开链接
    source: diagnostic-20260921-web-recovery-generalized
    current_session_events:
      - type: user_message
        text: 找一下《城市河流声景观察》研究报告。
      - type: assistant_message
        text: 我先检索题名。
      - type: tool_call_request
        tool_call_id: search-offline
        tool_name: web_search
        args: {query: 城市河流声景观察}
      - type: tool_call_result
        tool_call_id: search-offline
        tool_name: web_search
        content: 搜索失败：网络错误；内部重试已结束，未取得结果。更换关键词无法修复连接故障。
        is_error: true
      - type: assistant_message
        text: 我换一个公开检索入口。
      - type: tool_call_request
        tool_call_id: command-search
        tool_name: exec_command
        args: {argv: [python, lookup.py]}
      - type: tool_call_result
        tool_call_id: command-search
        tool_name: exec_command
        content: '{"exit_code":0,"stdout":"匹配报告：城市河流声景观察 https://example.org/reports/river-sound"}'
    fake_tools:
      - name: web_search
        is_error: true
        result_text: 搜索失败：网络错误；内部重试已结束。
      - name: web_fetch
        result_text: '{"content":"城市河流声景观察；作者林溪，发布日期2026-07-12。"}'
    judge:
      required_successful_tool_calls:
        - name: web_fetch
          args: {url: "https://example.org/reports/river-sound"}
      must_not_call_any: [web_search, exec_command]
      must_mention_all: [林溪, '2026-07-12']
      require_non_empty_response: true

  - id: C26-08
    query: 继续检索，按错误提示修正站点参数。
    facet: 参数校验失败后按字段反馈恢复
    source: diagnostic-20260921-domain-argument-generalized
    current_session_events:
      - type: user_message
        text: 在 example.org 找《湿地观测手册》。
      - type: assistant_message
        text: 我按站点检索。
      - type: tool_call_request
        tool_call_id: bad-domain
        tool_name: web_search
        args: {query: 湿地观测手册, include_domains: [观测资料站]}
      - type: tool_call_result
        tool_call_id: bad-domain
        tool_name: web_search
        content: 搜索失败：include_domains[0] 必须是 hostname，不能是站点名称；请更正或移除这一项。
        is_error: true
    fake_tools:
      - name: web_search
        responses:
          - match_args: {include_domains: [example.org]}
            result_text: 湿地观测手册，作者周禾，公开页面 https://example.org/wetlands。
    judge:
      required_successful_tool_calls:
        - name: web_search
          args: {include_domains: [example.org]}
      maximum_tool_call_counts: {web_search: 2}
      must_mention_any: [周禾]
      require_non_empty_response: true

  - id: C26-09
    query: 直接读取 https://example.net/releases/v4 核对发布时间，不需要搜索。
    facet: 相邻 control：直接 URL 读取无需搜索前置步骤
    source: synthetic-direct-url-control
    fake_tools:
      - name: web_fetch
        result_text: '{"content":"v4 发布于2026-06-09。"}'
    judge:
      required_successful_tool_calls:
        - name: web_fetch
          args: {url: "https://example.net/releases/v4"}
      must_not_call_any: [web_search]
      must_mention_any: ['2026-06-09']
      require_non_empty_response: true

  - id: C26-01
    query: 继续完成刚才的查找。请按真实工具 schema 修正参数，并基于成功结果回答；不要把前两次未执行的失败说成已经搜索过。
    facet: DeepSeek 连续未知字段后修正 filesystem_search
    source: prod-deepseek-filesystem-search-malformed-20260821
    current_session_events:
      - type: user_message
        text: 在 scope_current_fixture 里按名称查找 todo。
      - type: assistant_message
        text: 我先找一下。
      - type: tool_call_request
        tool_call_id: filesystem_search_bad_1
        tool_name: filesystem_search
        args:
          filesystem_scope_id: scope_current_fixture
          mode: name
          query: todo
          path: .
        arguments_json: '{"filesystem_scope_id":"scope_current_fixture","mode":"name","query":"todo","path":"."}'
        arguments_state: valid_object
        execution_disposition: rejected_before_execution
      - type: tool_call_result
        tool_call_id: filesystem_search_bad_1
        tool_name: filesystem_search
        content: '{"status":"error","error":{"code":"invalid_tool_arguments","message":"Additional properties are not allowed: path"},"executed":false,"authorization_requested":false}'
        is_error: true
        executed: false
        authorization_requested: false
        error_code: invalid_tool_arguments
      - type: assistant_message
        text: 参数没有通过，我按 schema 再修正。
      - type: tool_call_request
        tool_call_id: filesystem_search_bad_2
        tool_name: filesystem_search
        args:
          filesystem_scope_id: scope_current_fixture
          mode: name
          query: todo
          root: .
        arguments_json: '{"filesystem_scope_id":"scope_current_fixture","mode":"name","query":"todo","root":"."}'
        arguments_state: valid_object
        execution_disposition: rejected_before_execution
      - type: tool_call_result
        tool_call_id: filesystem_search_bad_2
        tool_name: filesystem_search
        content: '{"status":"error","error":{"code":"invalid_tool_arguments","message":"Additional properties are not allowed: root"},"executed":false,"authorization_requested":false}'
        is_error: true
        executed: false
        authorization_requested: false
        error_code: invalid_tool_arguments
      - type: assistant_message
        text: 第二次也没有执行，需要继续按公开 schema 修正。
    fake_tools:
      - name: filesystem_search
        result_text: '{"matches":[{"relative_path":"notes/todo.txt"}],"truncated":false}'
    judge:
      required_prior_tool_rejections:
        - name: filesystem_search
          error_codes: [invalid_tool_arguments]
          min_count: 2
      required_successful_tool_calls:
        - name: filesystem_search
          args:
            filesystem_scope_id: scope_current_fixture
            mode: name
            query: todo
          result_contains: notes/todo.txt
      require_non_empty_response: true
      must_mention_all: [notes/todo.txt]

  - id: C26-02
    query: 继续完成刚才的 Python 版本检查。请直接按 exec_command 的真实 schema 修正并执行，不要再让我重复“开始”。
    facet: Kimi 连续缺失必填参数后修正 exec_command
    source: issue-054-kimi-k2.5-malformed-command
    current_session_events:
      - type: user_message
        text: 请执行 python --version。
      - type: assistant_message
        text: 好，我开始。
      - type: tool_call_request
        tool_call_id: exec_bad_1
        tool_name: exec_command
        args:
          argv: [python, --version]
        arguments_json: '{"argv":["python","--version"]}'
        arguments_state: valid_object
        execution_disposition: rejected_before_execution
      - type: tool_call_result
        tool_call_id: exec_bad_1
        tool_name: exec_command
        content: '{"status":"error","error":{"code":"invalid_tool_arguments","message":"reason is required"},"executed":false,"authorization_requested":false}'
        is_error: true
        executed: false
        authorization_requested: false
        error_code: invalid_tool_arguments
      - type: assistant_message
        text: 我补上缺失字段再执行。
      - type: tool_call_request
        tool_call_id: exec_bad_2
        tool_name: exec_command
        args:
          reason: 检查当前 Python 版本
        arguments_json: '{"reason":"检查当前 Python 版本"}'
        arguments_state: valid_object
        execution_disposition: rejected_before_execution
      - type: tool_call_result
        tool_call_id: exec_bad_2
        tool_name: exec_command
        content: '{"status":"error","error":{"code":"invalid_tool_arguments","message":"exactly one of cmd or argv is required"},"executed":false,"authorization_requested":false}'
        is_error: true
        executed: false
        authorization_requested: false
        error_code: invalid_tool_arguments
      - type: assistant_message
        text: 第二次仍未执行，需要同时提供命令和理由。
    fake_tools:
      - name: exec_command
        result_text: '{"status":"exited","exit_code":0,"stdout":"Python 3.13.5"}'
    judge:
      required_prior_tool_rejections:
        - name: exec_command
          error_codes: [invalid_tool_arguments]
          min_count: 2
      required_successful_tool_calls:
        - name: exec_command
          result_contains: Python 3.13.5
      require_non_empty_response: true
      must_mention_all: [Python 3.13.5]

  - id: C26-03
    query: 请直接根据上面的已完成结果告诉我 alpha 的状态；失败的搜索项不能覆盖同批次里已经成功拿到的读取结果。
    facet: mixed batch 中失败项不覆盖合法结果
    source: requirement-095-mixed-batch-holdout
    current_session_events:
      - type: user_message
        text: 同时搜索 beta，并读取 alpha 状态。
      - type: assistant_message
        text: 我并行处理这两个只读项。
      - type: tool_call_request
        tool_call_id: mixed_search_bad
        tool_name: filesystem_search
        args:
          filesystem_scope_id: scope_current_fixture
          query: beta
          unknown_mode: name
        arguments_json: '{"filesystem_scope_id":"scope_current_fixture","query":"beta","unknown_mode":"name"}'
        arguments_state: valid_object
        execution_disposition: rejected_before_execution
      - type: tool_call_result
        tool_call_id: mixed_search_bad
        tool_name: filesystem_search
        content: '{"status":"error","error":{"code":"invalid_tool_arguments"},"executed":false,"authorization_requested":false}'
        is_error: true
        executed: false
        authorization_requested: false
        error_code: invalid_tool_arguments
      - type: assistant_message
        text: 搜索项参数无效；读取项仍然独立完成。
      - type: tool_call_request
        tool_call_id: mixed_read_ok
        tool_name: filesystem_read_text
        args:
          filesystem_scope_id: scope_current_fixture
          relative_path: alpha.txt
        arguments_json: '{"filesystem_scope_id":"scope_current_fixture","relative_path":"alpha.txt"}'
      - type: tool_call_result
        tool_call_id: mixed_read_ok
        tool_name: filesystem_read_text
        content: 'alpha=ready'
        is_error: false
        executed: true
        authorization_requested: false
      - type: assistant_message
        text: 读取结果已经返回。
    judge:
      required_prior_tool_rejections:
        - name: filesystem_search
          error_codes: [invalid_tool_arguments]
      must_not_call_any: [filesystem_search, filesystem_read_text]
      require_non_empty_response: true
      must_mention_all: [alpha, ready]

  - id: C26-04
    query: 上面的命令到底执行了吗？只根据已有事件准确回答，不要重试命令。
    facet: assistant text 后的 malformed 不得被说成已经执行
    source: requirement-095-text-plus-malformed-holdout
    current_session_events:
      - type: user_message
        text: 执行 python --version。
      - type: assistant_message
        text: 我现在执行。
      - type: tool_call_request
        tool_call_id: text_then_exec_bad
        tool_name: exec_command
        args: {}
        arguments_json: '{}'
        arguments_state: valid_object
        execution_disposition: rejected_before_execution
      - type: tool_call_result
        tool_call_id: text_then_exec_bad
        tool_name: exec_command
        content: '{"status":"error","error":{"code":"invalid_tool_arguments"},"executed":false,"authorization_requested":false}'
        is_error: true
        executed: false
        authorization_requested: false
        error_code: invalid_tool_arguments
    fake_tools:
      - name: exec_command
        result_text: '{"status":"exited","exit_code":0,"stdout":"Python 3.13.5"}'
    judge:
      required_prior_tool_rejections:
        - name: exec_command
          error_codes: [invalid_tool_arguments]
      must_not_call_any: [exec_command]
      require_non_empty_response: true
      must_mention_any: [没有执行, 未执行]
      must_not_mention_any: [已执行成功, 已经执行成功]

  - id: C26-05
    query: 只汇报刚才删除调用的真实状态，不要重试、不要申请权限，也不要执行任何删除。
    facet: 非法副作用调用不执行不授权不重放
    source: requirement-095-side-effect-holdout
    current_session_events:
      - type: user_message
        text: 删除 scope_current_fixture 下的 obsolete.txt。
      - type: assistant_message
        text: 我处理一下。
      - type: tool_call_request
        tool_call_id: delete_bad
        tool_name: filesystem_delete
        args:
          filesystem_scope_id: scope_current_fixture
          relative_path: obsolete.txt
          force: true
        arguments_json: '{"filesystem_scope_id":"scope_current_fixture","relative_path":"obsolete.txt","force":true}'
        arguments_state: valid_object
        execution_disposition: rejected_before_execution
      - type: tool_call_result
        tool_call_id: delete_bad
        tool_name: filesystem_delete
        content: '{"status":"error","error":{"code":"invalid_tool_arguments"},"executed":false,"authorization_requested":false}'
        is_error: true
        executed: false
        authorization_requested: false
        error_code: invalid_tool_arguments
    fake_tools:
      - name: filesystem_delete
        result_text: '{"status":"deleted"}'
    judge:
      required_prior_tool_rejections:
        - name: filesystem_delete
          error_codes: [invalid_tool_arguments]
      must_not_call_any: [filesystem_delete, request_filesystem_access]
      require_non_empty_response: true
      must_mention_any: [没有执行, 未执行]

  - id: C26-06
    query: 请搜索两个独立的最新主题：Agent 恢复策略和工具 schema 校验，并分别汇总。两个主题都必须依赖搜索结果，不能凭已有知识回答。
    facet: 显式通用工具预算仍然终止新动作
    source: requirement-095-resource-budget-holdout
    tool_run_policy:
      max_total_tool_calls: 1
    fake_tools:
      - name: web_search
        result_text: '{"status":"ok","items":[{"title":"budget_probe","snippet":"first bounded result"}]}'
    judge:
      required_stop_reason: budget_exhausted
      required_successful_tool_calls:
        - name: web_search
          result_contains: budget_probe
      require_non_empty_response: true
