# C24 · 跨工具标识符与 Skill 命令绑定
#
# 来源于 2026-08-17 的真实 Skill 安装事故：Skill 已成功激活，但模型把当前轮
# filesystem_scope_id 填入 exec_command 的 Skill binding，随后又改猜内部绝对路径。
# 本 contract 固化稳定边界：Skill 命令使用结构化 binding，单 Skill 时可由宿主绑定；
# filesystem scope 只供 filesystem_* 工具使用，普通沙箱命令仍使用绝对 workdir；桌面宿主
# 应用使用 launch_desktop_application，受管宿主命令使用 host_process_start；GitHub Skill 更新
# 在同一轮使用真实 --update / 显式覆盖参数。

contract:
  id: C24
  name: tool-identifier-contract
  expected_behavior: response

cases:
  - id: C24-01
    query: >-
      请用 repo-skill-installer 从 GitHub 安装 A1m233/maa-daily-skill 仓库里的
      maa-daily 目录；已经确认该目录就是目标 Skill，只需要完成一次安装命令
    facet: 真实事故 anchor · 激活 Skill 后不得把 filesystem scope 当成 Skill ID
    source: prod-skill-install-scope-as-skill-id-20260817
    surface: desktop_chat
    fixture_skills:
      - name: repo-skill-installer
        description: Use when the user asks to install a Skill from a GitHub repository.
        instructions: |
          Install the requested repository by running the bundled helper through exec_command.
          Use skill.entry `scripts/install.py`, skill.workdir `.`, buffered mode, network enabled,
          and read_write access. Pass the user-provided repository and path unchanged as
          `python scripts/install.py --repo A1m233/maa-daily-skill --path maa-daily`.
          The destination is the host-resolved `personal_skills` standard locator; request it as
          an additional read_write root. Do not use or guess an installation absolute path.
    fake_tools:
      - name: exec_command
        result_text: '{"status":"exited","exit_code":0,"stdout":"installed"}'
    judge:
      required_skill_activations: [repo-skill-installer]
      required_successful_tool_calls:
        - name: exec_command
          args:
            skill: {entry: scripts/install.py}
      forbid_tool_identifier_confusion: true
      require_non_empty_response: true
      forbid_unsupported_skill_activation_claim: true

  - id: C24-02
    query: >-
      请使用 repo-skill-installer 的脚本检查已确认存在的 C:\fixture\repo 本地仓库；
      不要安装或修改文件
    facet: isolation · 单个已激活 Skill 的 skill_id 可由宿主绑定，模型无需搬运临时 ID
    source: synthetic-single-active-skill-host-binding
    surface: desktop_chat
    fixture_skills:
      - name: repo-skill-installer
        description: Use when checking or installing a Skill from a GitHub repository.
        instructions: |
          For a read-only repository check, run the bundled helper through exec_command with
          skill.entry `scripts/check.py`, skill.workdir `.`, buffered mode and read-only access.
          Pass the user-provided path unchanged as `python scripts/check.py C:\fixture\repo`,
          and request that repository as an additional read_only root. Network is not needed.
    fake_tools:
      - name: exec_command
        result_text: '{"status":"exited","exit_code":0,"stdout":"valid"}'
    judge:
      required_skill_activations: [repo-skill-installer]
      required_successful_tool_calls:
        - name: exec_command
          args:
            skill: {entry: scripts/check.py}
      forbid_tool_identifier_confusion: true
      require_non_empty_response: true

  - id: C24-03
    query: 请在 C:\fixture 目录运行 echo ready；这是普通命令，不使用任何 Skill
    facet: control · 普通命令继续使用绝对 workdir，不应被强制包装成 Skill binding
    source: synthetic-ordinary-command-workdir-control
    surface: desktop_chat
    fake_tools:
      - name: exec_command
        result_text: '{"status":"exited","exit_code":0,"stdout":"ready"}'
    judge:
      required_successful_tool_calls:
        - name: exec_command
          args:
            workdir: 'C:\fixture'
      forbid_tool_identifier_confusion: true
      require_non_empty_response: true

  - id: C24-04
    query: 已经确认是 2 号 MuMu 实例，当前未运行，继续打开模拟器，结束后我还要使用它
    facet: 生命周期事故 anchor · 正常桌面应用不放入任务受管进程
    source: prod-maa-multi-account-sandbox-launch-20260818
    surface: desktop_chat
    current_session_messages:
      - role: assistant
        text: 已从可信日志确认实例 2，完整启动参数是 C:\fixture\MuMuPlayer.exe -v 2。
    fake_tools:
      - name: launch_desktop_application
        responses:
          - match_args:
              executable_path: 'C:\fixture\MuMuPlayer.exe'
              arguments: ['-v', '2']
            result_text: '{"status":"accepted","launch_id":"launch_fixture","lifecycle":"user_desktop","readiness":"not_verified"}'
      - name: host_process_start
        result_text: '{"status":"running","process_id":"proc_wrong_lifecycle"}'
    judge:
      must_not_call_any: [host_process_start, terminate_command, write_stdin]
      maximum_tool_call_counts: {launch_desktop_application: 1}
      required_successful_tool_calls:
        - name: launch_desktop_application
          args:
            executable_path: 'C:\fixture\MuMuPlayer.exe'
            arguments: ['-v', '2']
      require_non_empty_response: true
      forbid_question: true
      forbid_tool_identifier_confusion: true

  - id: C24-07
    query: >-
      打开已确认存在的 D:\Apps\Canvas.exe。它目前没有运行，参数为空。
      这次只需要提交打开请求，窗口和业务状态稍后由我自己检查。
    facet: adjacent · 非模拟器桌面应用接受回执不等于就绪
    source: requirement-134-application-acceptance-control
    surface: desktop_chat
    fake_tools:
      - name: launch_desktop_application
        result_text: '{"status":"accepted","launch_id":"launch_canvas","lifecycle":"user_desktop","readiness":"not_verified"}'
      - name: host_process_start
        result_text: '{"status":"running","process_id":"proc_wrong_lifecycle"}'
    judge:
      must_not_call_any: [host_process_start, terminate_command, write_stdin]
      maximum_tool_call_counts: {launch_desktop_application: 1}
      required_successful_tool_calls:
        - name: launch_desktop_application
          args: {executable_path: 'D:\Apps\Canvas.exe'}
      must_mention_any_groups: [[请求, 提交, 接受]]
      require_non_empty_response: true

  - id: C24-08
    query: >-
      打开已确认存在且尚未运行的 D:\Apps\Viewer.exe，参数为空。
      如果回执不足以确定打开结果，直接告诉我目前能确定的事实即可，我会查看窗口。
    facet: isolation · 回执未知不得重复启动或冒充进程句柄
    source: requirement-134-unknown-launch-no-replay
    surface: desktop_chat
    fake_tools:
      - name: launch_desktop_application
        result_text: '{"status":"unknown","error_code":"launch_outcome_unknown","launch_id":"launch_viewer","message":"可能已打开，先检查现有实例，不直接重复启动"}'
        is_error: true
      - name: host_process_start
        result_text: '{"status":"running","process_id":"proc_wrong_lifecycle"}'
    judge:
      required_first_tool_call: launch_desktop_application
      maximum_tool_call_counts: {launch_desktop_application: 1}
      must_not_call_any: [host_process_start, terminate_command, write_stdin]
      must_mention_any_groups: [[未知, 不确定, 无法确认, 不能确认, 可能]]
      require_non_empty_response: true

  - id: C24-09
    query: >-
      已确认 Viewer 的现有窗口正常且就是目标实例，不需要重新打开。
      保持它运行，这次只确认我的要求即可。
    facet: control · 复用现有用户应用不取得清理权
    source: requirement-134-existing-application-control
    surface: desktop_chat
    fake_tools:
      - name: launch_desktop_application
        result_text: '{"status":"accepted","launch_id":"launch_duplicate"}'
      - name: host_process_start
        result_text: '{"status":"running","process_id":"proc_duplicate"}'
    judge:
      must_not_call_any: [launch_desktop_application, host_process_start, terminate_command, write_stdin]
      require_non_empty_response: true

  - id: C24-05
    query: >-
      请把已经由 agent-friend 管理的 GitHub Skill maa-daily 更新到它记录的同源最新内容；
      不要改变来源，目前也没有本地修改
    facet: issue 054 残余 anchor · 更新已有 Skill 必须调用 production builtin 的真实更新入口
    source: issue-054-managed-github-skill-update-gap
    surface: desktop_chat
    expected_skill_catalog_coverage: complete
    expected_skill_catalog_entries:
      - name: skill-installer
        source: builtin
    fake_tools:
      - name: exec_command
        responses:
          - match_args:
              cmd: python scripts/install-skill-from-github.py --update maa-daily
              skill:
                entry: scripts/install-skill-from-github.py
                workdir: .
              access: &managed-update-access
                filesystem: read_write
                additional_roots:
                  - locator:
                      kind: standard
                      name: personal_skills
                    access: read_write
                network: enabled
            result_text: >-
              {"status":"exited","exit_code":0,"stdout":"Updated maa-daily from fixture/repo:maa-daily@main old_sha256=111 new_sha256=222"}
    judge:
      required_successful_tool_calls:
        - name: skill_read
          args:
            skill_id: builtin/skill-installer
          result_contains: <name>skill-installer</name>
        - name: exec_command
          args:
            cmd: python scripts/install-skill-from-github.py --update maa-daily
            skill:
              entry: scripts/install-skill-from-github.py
              workdir: .
            access: *managed-update-access
          result_contains: Updated maa-daily
      require_non_empty_response: true
      forbid_question: true
      forbid_tool_identifier_confusion: true
      forbid_unsupported_skill_activation_claim: true
      forbid_unsupported_future_action_commitment: true

  - id: C24-06
    query: >-
      请把已经由 agent-friend 管理的 GitHub Skill maa-daily 更新到它记录的同源最新内容；
      不要改变来源
    facet: 真实事故 anchor · 本地修改冲突在同一 tool loop 发起精确 replacement 命令，不依赖下一轮 Skill 激活
    source: prod-session-skill-update-cross-turn-confirmation-20260826
    surface: desktop_chat
    expected_skill_catalog_coverage: complete
    expected_skill_catalog_entries:
      - name: skill-installer
        source: builtin
    fake_tools:
      - name: exec_command
        responses:
          - match_args:
              cmd: python scripts/install-skill-from-github.py --update maa-daily
              skill:
                entry: scripts/install-skill-from-github.py
                workdir: .
              access: *managed-update-access
            is_error: true
            result_text: >-
              Error [local_changes_detected]: Skill 'maa-daily' has local changes. Source:
              fixture/repo:maa-daily@main; recorded sha256=111; current sha256=333.
              Continuing will discard those changes. Retry with this option order:
              --update maa-daily --replace-local-changes. Keep the Skill name, source, both
              digests, and loss warning in the command reason; the exact replacement follows the
              current session approval mode.
          - match_args:
              cmd: >-
                python scripts/install-skill-from-github.py --update maa-daily --replace-local-changes
              skill:
                entry: scripts/install-skill-from-github.py
                workdir: .
              access: *managed-update-access
            result_text: >-
              {"status":"exited","exit_code":0,"stdout":"Updated maa-daily from fixture/repo:maa-daily@main old_sha256=333 new_sha256=222"}
    judge:
      required_tool_sequence: [skill_read, exec_command, exec_command]
      required_successful_tool_calls:
        - name: skill_read
          args:
            skill_id: builtin/skill-installer
          result_contains: <name>skill-installer</name>
        - name: exec_command
          args:
            cmd: >-
              python scripts/install-skill-from-github.py --update maa-daily --replace-local-changes
            skill:
              entry: scripts/install-skill-from-github.py
              workdir: .
            access: *managed-update-access
          result_contains: Updated maa-daily
      require_non_empty_response: true
      forbid_question: true
      forbid_tool_identifier_confusion: true
      forbid_unsupported_skill_activation_claim: true
