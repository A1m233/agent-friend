# C1 · 跨会话回忆 (cross-session-recall)
#
# 契约:user query 明显暗示"当前 session 之外"的历史对话内容时,
# agent **必须**调用 `recall_past_chats` 工具(至少一次)。
#
# 判分:跑完看 trace.tool_calls,只要其中包含 name=recall_past_chats 的调用,即通过。
# 不关心调用参数是否最优(query 是否精准等),只看是否触发 — 触发率是 PoC 的第一道门。
#
# Case 构造原则:
#   - 每条 case 作为 first-turn 单轮 query 喂给 agent.Conversation,无 in-session 铺垫
#   - 跨 session 暗示是 query 中唯一的信号
#   - 优先采纳真实 session 中已出现过的 query(source: prod_session/<id>)作为 anchor
#   - 其余补足(my_synth)覆盖真实样本未达到的多样性维度
#
# 多轮 runner 仍以“前置当前会话消息 + 本轮 query”表达；C1-03 / C1-04 覆盖
# push-back 语气，C1-24 开始覆盖产品展示标题定向查询与错误能力陈述禁区。

contract:
  id: C1
  name: cross-session-recall
  expected_behavior: tool_must_be_called
  expected_tool: recall_past_chats

cases:
  # --- 真实 session anchor(直接采自生产 jsonl) ---
  - id: C1-01
    query: 你还记得我吗
    facet: 极简首轮 — 最高频开局 pattern
    source: prod_session/91c6dd02 + im:qq:27 + im:qq:28

  - id: C1-02
    query: 你还记得我们之前聊过什么吗
    facet: 开放回忆 — 无具体话题指向
    source: prod_session/91c6dd02

  - id: C1-03
    query: 我之前应该和你聊过天的,你一点都不记得了吗
    facet: push-back 语气首轮 — 用户预期 agent 应有印象
    source: prod_session/im:qq:27

  - id: C1-04
    query: 你真的一点都没有我们之前对话的印象吗
    facet: push-back 语气首轮 — 反问推断
    source: prod_session/im:qq:28

  - id: C1-05
    query: 你还记得我们最近聊了啥吗
    facet: 时间锚点"最近" + 开放回忆
    source: prod_session/im:qq:28

  - id: C1-06
    query: 你还记得我们聊的那道数学题吗
    facet: 具体话题回忆(学习场景)
    source: prod_session/im:qq:28

  - id: C1-07
    query: 你说好久不见,我们上次什么时候见的
    facet: 时间询问 + 含 agent 历史发言隐含
    source: prod_session/f82d6675

  # --- 多样性补充 ---
  - id: C1-08
    query: 我们上次聊到的那家面馆,你还记得叫什么名字吗?
    facet: 显式"上次" + 具体细节回忆(吃喝场景)
    source: my_synth

  - id: C1-09
    query: 上次那事儿后来怎么样了
    facet: 极简省略式 — 完全依赖历史定位"那事儿"
    source: my_synth

  - id: C1-10
    query: 上回我跟你说的那个面试,我还没告诉你结果呢
    facet: 上回 + 用户主动开新话题(agent 应先回忆背景)
    source: my_synth

  - id: C1-11
    query: 我之前跟你提过的搬家计划,定下来了
    facet: 之前 + 长期规划事件 + 用户主动汇报
    source: my_synth

  - id: C1-12
    query: 我有没有跟你说过我养了只猫?
    facet: 用户主动自 doubt — 必须查才能答
    source: my_synth

  - id: C1-13
    query: 我跟你提过我前任吗?
    facet: 短句 + 高情绪权重话题 + 强召回触发
    source: my_synth

  - id: C1-14
    query: 那个我跟你说过的我大学同学,最近又联系我了
    facet: 第三人称回忆 + 人物追踪 + 状态更新
    source: my_synth

  - id: C1-15
    query: 我妈那事儿,我后来又想了想
    facet: 极简 + 高语境(代指家人议题)
    source: my_synth

  - id: C1-16
    query: 你上次让我列的那个清单,我列出来了,要给你看吗?
    facet: agent 历史指令 + 用户主动汇报 + 旧任务延续
    source: my_synth

  - id: C1-17
    query: 你不是说想看纪录片吗,我找了个不错的
    facet: 反问归因 + 用户回礼式延续 agent 旧意图
    source: my_synth

  - id: C1-18
    query: 你之前跟我说让我别熬夜的,我这周做到了
    facet: agent 历史劝告 + 用户报告执行结果
    source: my_synth

  - id: C1-19
    query: 以前你推荐过的那本书,我读完了
    facet: 以前 + 推荐回忆 + 用户主动汇报进展
    source: my_synth

  - id: C1-20
    query: 那次我跟你倒苦水之后给我的那个建议挺管用的
    facet: 那次 + 情绪事件 + 正向反馈追溯
    source: my_synth

  # =========================================================================
  # v2 cases (C1-21..23) - fixture-grounded
  # ---------------------------------------------------------------------
  # 跟 v1 case 共存。每条带:
  #   - fixture_session: 跑前注入到 tmp SessionStore,recall_past_chats 能真召回到
  #   - judge: case 级判分,覆盖 contract 级 v1 规则
  #     - must_call: 必须调用的工具(留空则沿用 contract.expected_tool)
  #     - must_mention_any: final_text 至少出现其中一个(锚到 fixture 真实出现的实词)
  #     - must_not_mention_any: final_text 不得出现(fabrication 抓手 — 这些词在 fixture
  #       里没有,agent 若提到 = 凭印象编故事)
  # query 中刻意**不**含 must_mention_any 里的词,避免本轮 user_message 自带关键词导致
  # judge 短路通过。
  # =========================================================================

  - id: C1-21
    query: 我之前跟你说的那个搬家的事,有进展了
    facet: fixture-grounded · 长期规划 · 用户回头汇报
    source: my_synth
    fixture_session:
      days_ago: 7
      messages:
        - role: user
          text: 我最近在认真考虑搬家了,北京干得也累,杭州那边给了个 offer 涨 30%
        - role: assistant
          text: 杭州的 offer 是哪家?为啥这时候想搬?
        - role: user
          text: 新公司产品岗,待遇好不少。但我妈一直在北京,她身体也不太好,我有点犹豫
        - role: assistant
          text: 妈那边的考虑确实重,有跟她聊过你想搬过去的想法吗?
    judge:
      must_mention_any: ["杭州", "offer", "妈"]
      must_not_mention_any: ["上海", "深圳", "广州", "出国", "美国", "国外"]

  - id: C1-22
    query: 你还记得我跟你说我准备那个考试吗,最近又卡住了
    facet: fixture-grounded · 学习场景 · 具体卡点
    source: my_synth
    fixture_session:
      days_ago: 4
      messages:
        - role: user
          text: 我最近在准备 GMAT 考试,数学那块 data sufficiency 老分不清 C 和 D
        - role: assistant
          text: data sufficiency 的 C/D 确实是高频陷阱。是分不清"两个条件单独够不够",还是判断逻辑容易飘?
        - role: user
          text: 主要是看选项 1 觉得够了,看选项 2 又觉得也行,然后就选 D,但其实只用一个就行
        - role: assistant
          text: 这种就是被"两个都看着合理"的烟雾弹晃晕了。每个条件**单独**带回原题验一遍是最稳的
    judge:
      must_mention_any: ["GMAT", "data sufficiency", "C/D", "C 和 D"]
      must_not_mention_any: ["托福", "雅思", "考研", "GRE", "SAT", "高考"]

  - id: C1-23
    query: 上次跟你说过的那个工作上的事,有点新进展
    facet: fixture-grounded · 工作苦水 · 用户回头汇报
    source: my_synth
    fixture_session:
      days_ago: 5
      messages:
        - role: user
          text: 工作上最近挺烦的,我们组新来个领导,这周已经第三次因为汇报方式被点名了,加班到 11 点还不让走
        - role: assistant
          text: 听着像他在立威阶段,跟你个人能力不一定挂钩。你之前跟他对接过没?
        - role: user
          text: 没,他刚来两周。我已经在偷偷看 boss 了,真想直接跑路
        - role: assistant
          text: 想跑路的念头先放心里,行动可以等下个月看看他是过渡期还是常态
    judge:
      must_mention_any: ["领导", "加班", "跑路"]
      must_not_mention_any: ["年终", "裁员", "涨薪", "同事抢", "客户投诉"]

  - id: C1-24
    query: 去看看诗欣im这个会话里今天有没发什么
    facet: fixture-grounded · 展示标题定向 · 时间约束 · 会话总结
    source: regression/069
    fixture_session:
      title: 诗欣IM（用户在用）
      days_ago: 0
      messages:
        - role: user
          text: 今天我们确认了蓝鲸发布计划，先做灰度再全量
        - role: assistant
          text: 好，我记下关键顺序是蓝鲸、灰度、全量
    judge:
      must_mention_any: ["蓝鲸", "灰度", "全量"]
      must_not_mention_any:
        [
          "只能查当前会话",
          "无法查看其他会话",
          "不能跨会话",
          "recall_past_chats",
          "session_not_found",
          "查询参数",
        ]
      forbid_unsupported_lookup_claim: true

