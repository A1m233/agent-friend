[project]
license = "Apache-2.0"
name = "agent-eval"
version = "0.1.0"
description = "agent-friend · agent 行为契约评测工具"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agent",
    "llm-providers",
    "runtime-config",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[tool.uv.sources]
agent = { workspace = true }
llm-providers = { workspace = true }
runtime-config = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_eval"]
