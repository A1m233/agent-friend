[package]
name = "app"
version = "0.1.7"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["tray-icon", "macos-private-api", "protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-store = "2"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
# 025 · 统一文件日志：跨平台 base dir helper + 自定义时间戳
chrono = "0.4"
# 028 · bootstrap 同步读 store 文件路径（tauri-plugin-store 默认路径）
dirs = "5"
# 015 · push channel SSE subscriber
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
rand = "0.8"
# 016 · bubble window 显隐 → 跟随轮询 task 唤醒（park / unpark 语义）
tokio = { version = "1", features = ["sync", "time"] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-autostart = "2.5.1"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
os_info = "3"
# 054 · 一次性设备迁移：标准口令加密、迁移码与逐文件完整性。
age = { version = "=0.11.1", default-features = false }
bip39 = { version = "2.2", features = ["rand"] }
sha2 = "0.10"
# 056 · 用户 Spine 目录监听；0.3.x 保持与项目 Rust 1.77.2 MSRV 兼容。
notify-debouncer-full = "0.3.1"
tar = "0.4"
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "windows")'.dependencies]
# auto-launch 0.5 writes an unquoted Run command; normalize the public Run
# value after the plugin updates Windows' autostart state.
winreg = "0.10.1"
# 053 · WebView2 profile permission inspection + passive OS microphone access probe.
webview2-com = "0.38.2"
windows = { version = "0.61.3", features = [
    "Devices_Enumeration",
    "Security_Authorization_AppCapabilityAccess",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

# 015 · pet window 全屏浮动需要直接调 macOS NSWindow setLevel (Tauri 2 抽象未暴露)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSWindow", "NSResponder"] }
security-framework = "3"
core-foundation-sys = "0.8.7"
# 0004 / 017 · pet 窗切 NSPanel 路径（业界 macOS Tauri overlay 标准方案）
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
